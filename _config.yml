about_content: | # this will include new lines to allow paragraphs
  Hi, my name's Aleksei, I'm a QA Engineer based in Düsseldorf, Germany. I have 8+ years of experience across fintech, logistics, and industrial technology, with a strong focus on test automation, quality engineering, and software quality. I'm ISTQB® Certified Tester.

  My current tech stack includes:
   - Java, TypeScript, Python, Bash, SQL, Maven, Gradle
   - Playwright, Selenium, Selenide, REST-assured, TestNG, JUnit, Cucumber, Testcontainers
   - API, UI, integration, end-to-end, regression, performance, resilience, chaos, and exploratory testing
   - Kubernetes, OpenShift, Docker, Docker Compose, Helm, Ansible, AWS, Google Cloud, Azure
   - Jenkins, GitHub Actions, GitLab CI/CD, GitOps
   - PostgreSQL, MariaDB, MSSQL, MySQL, Oracle DB, InfluxDB, Kafka, MQTT, NATS JetStream
   - Grafana, Prometheus, Loki, Toxiproxy, Chaos Mesh
   - REST, HTTP, MQTT, Kafka, OAuth 2.0, JWT, LDAP, Active Directory, OpenLDAP, mTLS, TLS
   - Jira, Confluence, Qase.io, TestRail, Zephyr Scale, Postman, Swagger, Wireshark, Fiddler, DBeaver, Camunda
   - AI-assisted and agentic testing, including AI-assisted test generation, analysis, and debugging

  Ich kann ein bisschen Deutsch sprechen (B1+).

